name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build and test
    # Xcode 27 ships the macOS 27 SDK, which is what opts the app into the
    # macOS 27 behaviour. It is only on the xcode-27 image (public preview) for
    # now; DEVELOPER_DIR pins the exact Xcode so a new image default cannot
    # silently change the SDK the app links against.
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app
      CAFFEINUM_RENDER_DIR: ${{ github.workspace }}/dist/renders

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: make test

      - name: Build the app bundle
        run: make build

      - name: Verify the bundle
        run: |
          set -euo pipefail
          APP=dist/Caffeinum.app
          test -x "$APP/Contents/MacOS/Caffeinum"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Caffeinum")"
          echo "architectures: $ARCHS"
          [[ "$ARCHS" == "arm64" ]] || {
            echo "::error::expected an arm64 binary, got $ARCHS"; exit 1; }
          SDK="$(otool -l "$APP/Contents/MacOS/Caffeinum" |
            awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "sdk" { print $2; exit }')"
          echo "linked against SDK: $SDK"
          [[ "${SDK%%.*}" -ge 27 ]] || {
            echo "::error::expected the macOS 27 SDK or later, got $SDK"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --verbose "$APP"

      - name: Package the app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Caffeinum.app "dist/Caffeinum-${GITHUB_SHA::7}.zip"

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: Caffeinum-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload the menu panel renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renders-${{ github.sha }}
          path: dist/renders/*.png
          if-no-files-found: warn
