name: Release

# Tags are pushed by scripts/release.sh; this workflow does everything after
# that - test, build, package, publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASE_BRANCH: main

jobs:
  # A tag push carries no branch, and `on.push.tags` cannot be filtered by one,
  # so the branch check has to happen here. Nothing else runs until it passes.
  guard:
    name: Check the tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tagged commit is on ${{ env.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on $RELEASE_BRANCH - releases are cut from $RELEASE_BRANCH only"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on $RELEASE_BRANCH"

  release:
    name: Build and publish
    needs: guard
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a semver tag"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build=$(git rev-list --count HEAD)"
            if [[ "$VERSION" == *-* ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: make test

      - name: Build universal app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          UNIVERSAL: "1"
        run: ./scripts/build-app.sh

      - name: Verify the bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP=dist/Caffeinum.app
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Caffeinum")"
          echo "architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || {
            echo "::error::the bundle is not universal"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --verbose "$APP"
          STAMPED="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          [[ "$STAMPED" == "$VERSION" ]] || {
            echo "::error::bundle says $STAMPED, tag says $VERSION"; exit 1; }

      - name: Package the app
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="dist/Caffeinum-$VERSION-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Caffeinum.app "$ZIP"
          (cd dist && shasum -a 256 "$(basename "$ZIP")" > "$(basename "$ZIP").sha256")
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > dist/notes.md
          cat >> dist/notes.md <<EOF

          ## Install

          Download \`Caffeinum-$VERSION-universal.zip\`, unzip it and move
          \`Caffeinum.app\` into \`~/Applications\`. The bundle is ad-hoc signed but
          not notarised, so the first launch needs right-click → Open.

          \`\`\`
          $SHA256  Caffeinum-$VERSION-universal.zip
          \`\`\`
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          ARGS=(--title "$TAG" --notes-file dist/notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${ARGS[@]}" "$ZIP" "$ZIP.sha256"
